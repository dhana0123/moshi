[project]
name = "moshi"
requires-python = ">= 3.10,<3.15"
description = "Moshi is moshi"
dependencies = [
    "numpy >= 1.26, < 2.3",
    "safetensors >= 0.4.0, < 0.8.0",
    "huggingface-hub >= 0.24, < 1.0.0",
    "bitsandbytes >= 0.45, < 0.50.0; sys_platform == 'linux'",
    "einops >= 0.7, < 0.9",
    "sentencepiece >= 0.2.0, < 0.3",
    "sounddevice == 0.5",
    "sphn >= 0.2.0, < 0.3.0",
    "torch >= 2.2.0, < 2.10",
    "aiohttp>=3.10.5, <3.12",
    "tqdm >= 4.48",
]
authors = [{name="Laurent Mazaré", email="laurent@kyutai.org"}]
maintainers = [{name="Laurent Mazaré", email="laurent@kyutai.org"}]
license = {text = "MIT"}
dynamic = ["version"]
readme = "README.md"

[project.scripts]
moshi-server-py = "moshi.server:main"
moshi-client-py = "moshi.client:main"
moshi-inference = "moshi.run_inference:main"
moshi-tts = "moshi.run_tts:main"
moshi-train = "moshi.train.loop:main"
moshi-train-eta = "moshi.train.bench_eta:main"
moshi-prepare-data = "moshi.train.data.prepare:main"
moshi-eval = "moshi.evaluate.evaluate:main"
moshi-eval-bench = "moshi.evaluate.run_bench:main"

[tool.setuptools.dynamic]
version = {attr = "moshi.__version__"}

[tool.setuptools.package-data]
"moshi.train" = ["configs/*.yaml"]
"moshi.evaluate.judge.assets" = ["*.json"]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project.optional-dependencies]
dev = [
    "pyright",
    "pytest",
    "flake8",
    "pre-commit",
    "gradio-webrtc>=0.0.18"
]
train = [
    "pyyaml >= 6.0",
]
# Dataset packer ASR (IndicConformer) + eval ASR share NeMo.
data = [
    "nemo_toolkit[asr]",
    "torchaudio",
    "datasets",
    "soundfile",
    "pyannote.audio >= 3.1",
    "whisperx",
]
eval = [
    "torchaudio",
    "silero-vad",
    "scipy",
    "nemo_toolkit[asr]",
    "openai",
    "tqdm >= 4.48",
]

# Ruff is not enforced atm, but if you want to use it on your code
# (e.g. via "Format modified lines" in VSCode), you'll get these settings
[tool.ruff]
line-length = 120
